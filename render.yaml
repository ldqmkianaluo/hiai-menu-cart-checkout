# Render 蓝图：连上 GitHub 仓库后，在 Render 里「New → Blueprint」即可一键部署
services:
  - type: web
    name: hiai-menu-cart-checkout
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/demo/health
    autoDeploy: true
    envVars:
      - key: AI_API_KEY
        sync: false # 在 Render 面板里手动填，别写进仓库
      - key: AI_MODEL
        value: deepseek-chat
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75
